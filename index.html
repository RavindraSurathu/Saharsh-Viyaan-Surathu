<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saharsh Viyaan Surathu turns ONE!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;800&family=Noto+Sans+Telugu:wght@400;600;800&family=Pacifico&family=Ramaraja&display=swap" rel="stylesheet">
<style>
:root{--choc:#3b2218;--cocoa:#6b4226;--caramel:#c98a4b;--cream:#fff8ef;--white:#fff;--blush:#ffb8c6;--sky:#8fd3f4;--butter:#ffd95a;--mint:#a8e6cf}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:'Nunito',sans-serif;background:var(--cream);color:var(--choc);line-height:1.6;overflow-x:hidden}
h1,h2,h3,.fred,.btn,.small,.cd b,.pol p,.one{font-family:'Fredoka',sans-serif}
html[lang=te] body,html[lang=te] h1,html[lang=te] h2,html[lang=te] h3,html[lang=te] .fred,html[lang=te] .btn,html[lang=te] .small,html[lang=te] .pol p{font-family:'Noto Sans Telugu','Nunito',sans-serif;line-height:1.7}
html[lang=te] .hero h1{line-height:1.25}
canvas#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
section{padding:72px 20px;max-width:1000px;margin:auto;text-align:center}
h2{font-size:clamp(28px,5vw,42px);margin-bottom:8px;color:var(--cocoa)}
.sub{margin-bottom:32px;opacity:.85}

#lang{position:fixed;top:14px;right:14px;z-index:60;border:3px solid var(--choc);background:var(--butter);color:var(--choc);font:700 16px 'Noto Sans Telugu','Fredoka',sans-serif;padding:8px 18px;border-radius:30px;cursor:pointer;box-shadow:0 4px 0 var(--choc)}
#lang:active{transform:translateY(3px);box-shadow:0 1px 0 var(--choc)}

.hero{background:var(--choc);color:var(--cream);max-width:none;position:relative;overflow:hidden;padding:70px 20px 110px}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:60px;background:radial-gradient(circle at 20px -6px,var(--cream) 22px,transparent 23px) 0 0/40px 60px repeat-x}
.hero-in{max-width:760px;margin:auto;position:relative;z-index:2}
.small{font-size:20px;color:var(--butter)}
.hero h1{font-size:clamp(38px,9vw,78px);line-height:1.05;margin:8px 0 6px;font-weight:700}
.hero h1 span{display:block;font-size:.5em;font-weight:400;color:var(--blush)}
.hero h1 span[data-t=name]{font-family:'Pacifico',cursive;font-size:.85em;font-weight:400;line-height:1.35;padding:.05em .1em .2em;background:linear-gradient(90deg,#fff8ef,#ffd95a,#ffb8c6,#8fd3f4,#fff8ef);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(201,138,75,.55));animation:shine 7s linear infinite}
html[lang=te] .hero h1 span[data-t=name]{font-family:'Ramaraja','Noto Sans Telugu',serif;font-size:.8em}
@keyframes shine{to{background-position:300% 0}}
.one{font-weight:700;font-size:clamp(64px,16vw,130px);line-height:1;color:var(--choc);background:var(--butter);border-radius:50%;width:1.35em;height:1.35em;display:inline-grid;place-items:center;transform:rotate(-8deg);box-shadow:0 0 0 8px var(--cream),0 0 0 14px var(--caramel);margin:18px 0}
.bear{width:min(260px,60vw);margin:10px auto 0;display:block;animation:sway 3.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(3deg)}}
.btn{display:inline-block;font-size:19px;font-weight:600;padding:14px 30px;border-radius:40px;border:0;cursor:pointer;background:var(--caramel);color:var(--choc);text-decoration:none;box-shadow:0 5px 0 var(--cocoa);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--cocoa)}
.btn:focus-visible,a:focus-visible,#lang:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.invite{margin:22px auto 0;padding:16px 20px;border:2px dashed var(--caramel);border-radius:22px;max-width:560px;font-size:18px}
.invite b{color:var(--butter);display:block;font-size:20px}
.balloon{position:absolute;bottom:-120px;width:46px;height:58px;border-radius:50% 50% 48% 48%;opacity:.9;animation:rise linear infinite;z-index:1}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:60px;background:rgba(255,248,239,.5)}
@keyframes rise{to{transform:translateY(-130vh) rotate(8deg)}}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.card{background:var(--white);border:3px solid var(--choc);border-radius:26px;padding:26px 18px;box-shadow:6px 6px 0 var(--caramel)}
.card:nth-child(even){border-radius:26px 26px 26px 6px;transform:rotate(1deg)}
.card:nth-child(odd){transform:rotate(-1deg)}
.card .ic{font-size:38px}
.card h3{font-size:22px;margin:4px 0}
.card a{color:var(--cocoa);font-weight:800}

.count{background:var(--white);max-width:none;border-top:3px dashed var(--caramel);border-bottom:3px dashed var(--caramel)}
.cd{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.cd div{background:var(--choc);color:var(--cream);border-radius:22px;padding:14px 10px;min-width:88px}
.cd b{display:block;font-size:40px;line-height:1.1;color:var(--butter)}

.main-photo{max-width:420px;margin:0 auto 36px}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:26px}
.pol{background:var(--white);padding:12px 12px 10px;border-radius:6px;box-shadow:0 8px 20px rgba(59,34,24,.25);transform:rotate(var(--r,0deg));transition:transform .25s}
.pol:hover{transform:rotate(0) scale(1.04)}
.slot{aspect-ratio:1/1;background:repeating-linear-gradient(45deg,#f3e3d0 0 12px,#fbeedd 12px 24px);border-radius:4px;overflow:hidden;display:grid;place-items:center;position:relative}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .ph{font-size:13px;color:var(--cocoa);padding:8px;word-break:break-all}
.slot .ph i{display:block;font-style:normal;font-size:40px}
.pol p{margin-top:8px;color:var(--cocoa)}
.main-photo .slot{aspect-ratio:4/5}

.rsvp{background:var(--choc);color:var(--cream);max-width:none}
.rsvp h2{color:var(--butter)}
.rsvp .btn{background:var(--cream)}
.foot{padding:30px 20px 50px;text-align:center;color:var(--cocoa)}
#bar{position:fixed;top:0;left:0;height:6px;width:0;z-index:70;background:linear-gradient(90deg,var(--caramel),var(--butter),var(--blush));border-radius:0 6px 6px 0}
.deco{position:fixed;left:0;top:0;font-size:30px;opacity:.4;z-index:-1;pointer-events:none}
html.js .rv{opacity:0;translate:0 50px;scale:.92;transition:opacity .7s,translate .9s cubic-bezier(.2,1.5,.4,1),scale .9s cubic-bezier(.2,1.5,.4,1),rotate .9s cubic-bezier(.2,1.5,.4,1),transform .25s}
html.js .rv.zoom{translate:0 0;scale:.2}
html.js .rv.drop{translate:0 -110px;rotate:-14deg;scale:.85}
html.js .rv.drop:nth-child(even){rotate:14deg}
html.js .rv.flip{transform:perspective(600px) rotateX(-95deg);transform-origin:50% 0;translate:0 0;scale:1;transition:opacity .7s,transform .9s cubic-bezier(.2,1.4,.4,1)}
html.js .rv.in,html.js .rv.drop.in:nth-child(even){opacity:1;translate:0 0;scale:1;rotate:0deg}
html.js .rv.flip.in{transform:none}
@media (prefers-reduced-motion:reduce){.hero h1 span[data-t=name]{animation:none}}
@media (prefers-reduced-motion:reduce){.bear,.balloon{animation:none}.balloon{display:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<canvas id="confetti" aria-hidden="true"></canvas>
<div id="bar" aria-hidden="true"></div>
<button id="lang" type="button">తెలుగు</button>

<header class="hero">
  <div class="hero-in">
    <p class="small" data-t="kicker"></p>
    <h1><span data-t="name"></span><span data-t="turning"></span></h1>
    <div class="one" aria-label="1">1</div>
    <svg class="bear" viewBox="0 0 240 250" role="img" aria-label="Teddy bear wearing a party hat">
      <circle cx="58" cy="62" r="26" fill="#8a5a36"/><circle cx="58" cy="62" r="14" fill="#e9b98a"/>
      <circle cx="182" cy="62" r="26" fill="#8a5a36"/><circle cx="182" cy="62" r="14" fill="#e9b98a"/>
      <ellipse cx="120" cy="215" rx="62" ry="34" fill="#8a5a36"/>
      <ellipse cx="120" cy="190" rx="52" ry="58" fill="#9b6a42"/>
      <ellipse cx="120" cy="198" rx="32" ry="38" fill="#e9b98a"/>
      <ellipse cx="62" cy="180" rx="16" ry="30" fill="#8a5a36" transform="rotate(25 62 180)"/>
      <ellipse cx="178" cy="180" rx="16" ry="30" fill="#8a5a36" transform="rotate(-25 178 180)"/>
      <ellipse cx="86" cy="238" rx="24" ry="12" fill="#8a5a36"/><ellipse cx="154" cy="238" rx="24" ry="12" fill="#8a5a36"/>
      <circle cx="120" cy="96" r="58" fill="#9b6a42"/>
      <ellipse cx="120" cy="116" rx="26" ry="20" fill="#f3d3ab"/>
      <circle cx="98" cy="90" r="7" fill="#3b2218"/><circle cx="142" cy="90" r="7" fill="#3b2218"/>
      <circle cx="100" cy="87" r="2.5" fill="#fff"/><circle cx="144" cy="87" r="2.5" fill="#fff"/>
      <ellipse cx="120" cy="106" rx="10" ry="7" fill="#3b2218"/>
      <path d="M120 113v6M108 123q12 10 24 0" stroke="#3b2218" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="80" cy="108" r="8" fill="#ffb8c6" opacity=".8"/><circle cx="160" cy="108" r="8" fill="#ffb8c6" opacity=".8"/>
      <path d="M120 10l-32 42h64z" fill="#ffd95a" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
      <path d="M100 38l8-10M118 30l6 12M134 40l10-6" stroke="#ffb8c6" stroke-width="4" stroke-linecap="round"/>
      <circle cx="120" cy="10" r="7" fill="#ffb8c6"/>
      <path d="M120 156l-20-10v22zM120 156l20-10v22z" fill="#fff" stroke="#3b2218" stroke-width="2"/>
      <circle cx="120" cy="157" r="6" fill="#c98a4b"/>
    </svg>
    <p style="margin:26px 0 8px;font-size:19px" data-t="lead"></p>
    <div class="invite"><b data-t="invLabel"></b><span data-t="invBy"></span></div>
    <p style="margin-top:26px"><button class="btn" id="pop" data-t="pop"></button></p>
  </div>
</header>

<section id="details">
  <h2 data-t="h_date"></h2>
  <p class="sub" data-t="sub_date"></p>
  <div class="cards" id="cards"></div>
</section>

<section class="count">
  <h2 data-t="h_cd"></h2>
  <p class="sub" data-t="sub_cd"></p>
  <div class="cd" id="cd"></div>
</section>

<section id="photos">
  <h2 data-t="h_ph"></h2>
  <p class="sub" data-t="sub_ph"></p>
  <div class="main-photo" id="mainPhoto"></div>
  <div class="gal" id="gal"></div>
</section>

<section class="rsvp" id="rsvp">
  <h2 data-t="h_rsvp"></h2>
  <p class="sub" data-t="sub_rsvp"></p>
  <a class="btn" id="wa" href="#" target="_blank" rel="noopener" data-t="wa"></a>
</section>

<footer class="foot">
  <p class="fred" style="font-size:20px" data-t="foot1"></p>
  <p data-t="foot2"></p>
</footer>

<script>
/* ===== EDIT THIS BLOCK ===== */
const CONFIG = {
  partyDate: "2026-11-28T19:00:00",   // local time
  mapLink: "https://maps.app.goo.gl/CJND2dXbT9ADyoSf7?g_st=ic",
  whatsapp: "919542222213",            // country code + number, no + or spaces
  mainPhoto: "photos/saharsh-main.jpg",
  photos: [                            // upload to the photos/ folder with these names
    {src:"photos/month-01.jpg", en:"Newborn",        te:"నవజాత శిశువు"},
    {src:"photos/month-03.jpg", en:"3 months",       te:"3 నెలలు"},
    {src:"photos/month-06.jpg", en:"6 months",       te:"6 నెలలు"},
    {src:"photos/month-09.jpg", en:"9 months",       te:"9 నెలలు"},
    {src:"photos/month-12.jpg", en:"12 months",      te:"12 నెలలు"},
    {src:"photos/family.jpg",   en:"With Mom & Dad", te:"అమ్మానాన్నలతో"}
  ]
};
const T = {
 en:{
  btn:"తెలుగు", kicker:"Join us for our little bear’s big day",
  name:"Saharsh Viyaan Surathu", turning:"is turning",
  lead:"Come celebrate our teddy bear’s very first birthday with cake, cuddles and lots of chocolate!",
  invLabel:"Invited by", invBy:"Nayanamma & Thathayya Garu – Surathu Srinivasa Rao & Devi & Family",
  pop:"Pop the confetti", h_date:"Save the date", sub_date:"Saharsh Viyaan’s 1st Birthday Celebration",
  cards:[["📅","Date","Saturday, 28 November 2026"],["🕖","Time","7:00 PM onwards<br>Dinner follows"],
   ["📍","Venue","SVLT Sainadha Kalyana Mandapam,<br>Donka Road, near M Hotel,<br>Krishnalanka<br><a href=\"{map}\" target=\"_blank\" rel=\"noopener\">Open in Maps</a>"],
   ["🧸","Theme","Teddy bear party in chocolate and white"]],
  h_cd:"Counting down to the party", sub_cd:"Until the first bite of cake",
  units:["Days","Hours","Mins","Secs"],
  h_ph:"One year of cuddles", sub_ph:"Our little bear, month by month", main:"Our birthday boy", add:"Add photo",
  h_rsvp:"Will you bear with us?", sub_rsvp:"Let us know you’re coming so we save you a slice.",
  wa:"RSVP on WhatsApp", wamsg:"Hi! We will be there for Saharsh Viyaan’s 1st birthday 🧸🎂",
  foot1:"With love, the Surathu family", foot2:"Made with honey, chocolate and a lot of teddy bears"},
 te:{
  btn:"English", kicker:"మా చిన్ని టెడ్డీ బేర్ పెద్ద పండుగకు రండి",
  name:"సహర్ష్ వియాన్ సురతు", turning:"మొదటి పుట్టినరోజు",
  lead:"మా బుజ్జి టెడ్డీ బేర్ తొలి పుట్టినరోజు వేడుకలో కేక్, ముద్దులు, చాక్లెట్లతో కలిసి సంబరాలు చేసుకుందాం రండి!",
  invLabel:"ఆహ్వానించువారు", invBy:"నాయనమ్మ & తాతయ్య గారు – సురతు శ్రీనివాసరావు & దేవి & కుటుంబ సభ్యులు",
  pop:"కాన్ఫెట్టి పేల్చండి", h_date:"తేదీ గుర్తుంచుకోండి", sub_date:"సహర్ష్ వియాన్ తొలి పుట్టినరోజు వేడుక",
  cards:[["📅","తేదీ","28 నవంబర్ 2026, శనివారం"],["🕖","సమయం","సాయంత్రం 7:00 గంటల నుండి<br>తరువాత విందు"],
   ["📍","వేదిక","SVLT సాయినాథ కళ్యాణ మండపం,<br>డోంకా రోడ్, ఎం హోటల్ దగ్గర,<br>కృష్ణలంక<br><a href=\"{map}\" target=\"_blank\" rel=\"noopener\">మ్యాప్‌లో చూడండి</a>"],
   ["🧸","థీమ్","చాక్లెట్ & వైట్ టెడ్డీ బేర్ పార్టీ"]],
  h_cd:"వేడుకకు కౌంట్‌డౌన్", sub_cd:"కేక్ కట్ చేసే క్షణం వరకు",
  units:["రోజులు","గంటలు","నిమిషాలు","సెకన్లు"],
  h_ph:"ఏడాది ముచ్చట్లు", sub_ph:"మా చిన్నారి, నెల నెలా", main:"మా పుట్టినరోజు బాబు", add:"ఫొటో జతచేయండి",
  h_rsvp:"మీరు తప్పక రావాలి!", sub_rsvp:"మీరు వస్తున్నట్లు తెలియజేయండి, మీ కోసం కేక్ ముక్క దాచిపెడతాం.",
  wa:"వాట్సాప్‌లో తెలియజేయండి", wamsg:"నమస్తే! సహర్ష్ వియాన్ తొలి పుట్టినరోజు వేడుకకు మేము వస్తున్నాం 🧸🎂",
  foot1:"ప్రేమతో, సురతు కుటుంబం", foot2:"తేనె, చాక్లెట్, ఎన్నో టెడ్డీ బేర్లతో తయారైన ఆహ్వానం"}
};
/* =========================== */

const $=id=>document.getElementById(id);
let lang="en";
try{const q=new URLSearchParams(location.search).get("lang")||localStorage.getItem("lang");if(q==="te")lang="te"}catch(e){}

/* photo slots: show image if the file exists, else a placeholder */
const labels=[];
function slot(src,get,rot){
  const d=document.createElement("div");d.className="pol";d.style.setProperty("--r",rot+"deg");
  d.innerHTML='<div class="slot"><div class="ph"><i>🧸</i><span class="add"></span><br>'+src+'</div></div><p></p>';
  labels.push(()=>{d.querySelector("p").textContent=get(T[lang]);d.querySelector(".add").textContent=T[lang].add;
    const im=d.querySelector("img");if(im)im.alt=get(T[lang])});
  const img=new Image();img.onload=()=>{d.querySelector(".slot").appendChild(img);img.alt=d.querySelector("p").textContent};img.src=src;
  return d;
}
$("mainPhoto").appendChild(slot(CONFIG.mainPhoto,t=>t.main,-2));
CONFIG.photos.forEach((p,i)=>$("gal").appendChild(slot(p.src,()=>p[lang],[-3,2,-1.5,3,-2.5,1.5][i%6])));

function render(){
  const t=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t[e.dataset.t]);
  $("lang").textContent=t.btn;
  $("cards").innerHTML=t.cards.map(c=>`<div class="card rv zoom"><div class="ic">${c[0]}</div><h3>${c[1]}</h3><p>${c[2].replace("{map}",CONFIG.mapLink)}</p></div>`).join("");
  if($("cards").classList.contains("seen"))$("cards").querySelectorAll(".rv").forEach(k=>k.classList.add("in"));
  $("wa").href="https://wa.me/"+CONFIG.whatsapp+"?text="+encodeURIComponent(t.wamsg);
  labels.forEach(f=>f());tick();
  document.title=lang==="te"?"సహర్ష్ వియాన్ తొలి పుట్టినరోజు":"Saharsh Viyaan Surathu turns ONE!";
}
$("lang").onclick=()=>{lang=lang==="en"?"te":"en";try{localStorage.setItem("lang",lang)}catch(e){}render()};

/* countdown */
const target=new Date(CONFIG.partyDate).getTime();
function tick(){
  let s=Math.max(0,Math.floor((target-Date.now())/1000));
  const cd=$("cd");
  if(!cd.children.length)cd.innerHTML='<div class="rv flip"><b></b><span></span></div>'.repeat(4);
  [86400,3600,60,1].forEach((m,i)=>{const x=Math.floor(s/m);s-=x*m;cd.children[i].firstChild.textContent=x;cd.children[i].lastChild.textContent=T[lang].units[i]});
}
setInterval(tick,1000);

/* floating balloons */
const hero=document.querySelector(".hero"),cols=["#ffb8c6","#8fd3f4","#ffd95a","#a8e6cf","#c98a4b","#fff8ef"],calm=matchMedia("(prefers-reduced-motion:reduce)").matches;
if(!calm)for(let i=0;i<10;i++){const b=document.createElement("div");b.className="balloon";
  b.style.cssText=`left:${5+i*10}%;background:${cols[i%6]};animation-duration:${9+Math.random()*8}s;animation-delay:${-Math.random()*12}s`;hero.appendChild(b)}

/* confetti */
const cv=$("confetti"),cx=cv.getContext("2d");let bits=[],run=false;
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener("resize",size);
function burst(n=140){
  const c=["#ffb8c6","#8fd3f4","#ffd95a","#a8e6cf","#c98a4b","#ffffff","#6b4226"];
  for(let i=0;i<n;i++)bits.push({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*16,vy:-Math.random()*14-3,w:6+Math.random()*7,h:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:c[i%c.length],round:i%4==0});
  if(!run){run=true;requestAnimationFrame(loop)}
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  bits.forEach(b=>{b.vy+=.28;b.vx*=.99;b.x+=b.vx;b.y+=b.vy;b.r+=b.vr;cx.save();cx.translate(b.x,b.y);cx.rotate(b.r);cx.fillStyle=b.c;
    if(b.round){cx.beginPath();cx.arc(0,0,b.w/2,0,7);cx.fill()}else cx.fillRect(-b.w/2,-b.h/2,b.w,b.h);cx.restore()});
  bits=bits.filter(b=>b.y<cv.height+20);
  if(bits.length)requestAnimationFrame(loop);else{run=false;cx.clearRect(0,0,cv.width,cv.height)}
}
$("pop").onclick=()=>burst();
render();

/* ===== scroll animations ===== */
if(!calm){
  document.documentElement.classList.add("js");
  document.querySelectorAll("h2,.sub,.foot p").forEach(e=>e.classList.add("rv"));
  document.querySelectorAll(".pol").forEach((e,i)=>{e.classList.add("rv","drop");e.dataset.d=(i%3)*.15});
  $("wa").classList.add("rv","zoom");
  const io=new IntersectionObserver(es=>es.forEach(e=>{
    if(!e.isIntersecting)return;const t=e.target;io.unobserve(t);t.classList.add("seen");
    const kids=t.classList.contains("rv")?[t]:[...t.querySelectorAll(".rv")];
    kids.forEach((k,i)=>{const d=k.dataset.d?+k.dataset.d:i*.14;k.style.transitionDelay=d+"s";k.classList.add("in");setTimeout(()=>k.style.transitionDelay="",1800+d*1000)});
    if(t.id==="rsvp")burst(170);
  }),{threshold:.2});
  document.querySelectorAll(".rv,#cards,#cd,#rsvp").forEach(e=>{if(!e.closest("#cards,#cd")||e.id==="cards"||e.id==="cd")io.observe(e)});

  /* scroll progress, spinning 1, drifting emoji */
  const one=document.querySelector(".one"),bar=$("bar"),E=["🧸","🎈","⭐","🍫","🎂","🧸","🎈","🍪"],X=[4,90,10,84,6,92,14,80];
  const decos=E.map((c,i)=>{const s=document.createElement("span");s.className="deco";s.textContent=c;s.style.left=X[i]+"%";document.body.appendChild(s);return s});
  function onScroll(){
    const y=scrollY,h=document.documentElement.scrollHeight-innerHeight,H=innerHeight+120;
    bar.style.width=(h>0?y/h*100:0)+"%";
    one.style.rotate=(y*.18)+"deg";
    decos.forEach((s,i)=>{const v=(((i*H/8-y*(.25+(i%4)*.12))%H)+H)%H;s.style.translate="0 "+(v-60)+"px";s.style.rotate=(y*.1*(i%2?1:-1))+"deg"});
  }
  addEventListener("scroll",()=>requestAnimationFrame(onScroll),{passive:true});onScroll();
}else{
  $("bar").style.display="none";
}
if(!calm)setTimeout(()=>burst(180),600);
</script>
</body>
</html>
