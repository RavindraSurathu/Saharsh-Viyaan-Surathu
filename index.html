  <!-- ================= RSVP ================= -->
  <section class="sec" id="rsvp" data-sec data-l="RSVP">
    <div class="wrap center">
      <h2 class="h2 mask"><span data-i18n="rv_h"></span></h2>
      <p class="sub rv" data-i18n="rv_s"></p>

      <form class="paper form rv" id="rsvpForm" novalidate>
        <div class="paper-in">
          <div class="field">
            <label for="fName" data-i18n="f_name"></label>
            <input type="text" id="fName" autocomplete="name" maxlength="60" data-i18n-ph="f_name_ph">
          </div>
          <div class="field seg" role="radiogroup">
            <input type="radio" name="att" id="attY" value="yes" checked><label for="attY" data-i18n="f_yes"></label>
            <input type="radio" name="att" id="attN" value="no"><label for="attN" data-i18n="f_no"></label>
          </div>
          <div class="field" id="guestsField">
            <span class="lbl" data-i18n="f_guests"></span>
            <div class="stepper"><button type="button" id="gMinus" aria-label="−">−</button><output id="gOut" aria-live="polite">2</output><button type="button" id="gPlus" aria-label="+">+</button></div>
          </div>
          <div class="field">
            <label for="fNote" data-i18n="f_note"></label>
            <textarea id="fNote" maxlength="240" data-i18n-ph="f_note_ph"></textarea>
          </div>
          <p class="err" id="fErr" role="alert"></p>
          <button class="btn mag" type="submit" data-i18n="f_send"></button>
        </div>
      </form>
    </div>
  </section>
